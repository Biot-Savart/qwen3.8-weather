<!doctype html>
<html
	lang="en"
	data-theme="dark"
>
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Nimbus — Interactive Weather</title>
		<meta
			name="description"
			content="Nimbus — a feature-rich, interactive weather app built with vanilla JavaScript. Powered by Open-Meteo."
		/>
		<meta
			name="theme-color"
			content="#0d1830"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="./assets/icon.svg"
		/>
		<link
			rel="manifest"
			href="./manifest.webmanifest"
		/>
		<link
			rel="stylesheet"
			href="./css/styles.css"
		/>
	</head>
	<body>
		<canvas
			id="bg-canvas"
			aria-hidden="true"
		></canvas>

		<div id="app">
			<!-- ======= TOP BAR ======= -->
			<header class="topbar">
				<div
					class="brand"
					title="Nimbus"
				>
					<img
						src="./assets/icon.svg"
						alt=""
						width="30"
						height="30"
					/>
					<span class="brand-name">Nimbus</span>
				</div>

				<div
					class="search-wrap"
					id="search-wrap"
				>
					<svg
						class="search-ico"
						viewBox="0 0 24 24"
						aria-hidden="true"
					>
						<circle
							cx="11"
							cy="11"
							r="7"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
						/>
						<path
							d="m20 20-3.8-3.8"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
						/>
					</svg>
					<input
						id="search-input"
						type="text"
						placeholder="Search any city…"
						autocomplete="off"
						spellcheck="false"
						aria-label="Search for a location"
					/>
					<kbd
						class="search-kbd"
						aria-hidden="true"
						>/</kbd
					>
					<div
						id="search-results"
						class="search-results"
						role="listbox"
						hidden
					></div>
				</div>

				<div class="controls">
					<button
						id="locate-btn"
						class="icon-btn"
						title="Use my location"
						aria-label="Use my location"
					>
						<svg
							viewBox="0 0 24 24"
							width="18"
							height="18"
							aria-hidden="true"
						>
							<circle
								cx="12"
								cy="12"
								r="3.2"
								fill="currentColor"
							/>
							<path
								d="M12 2v3M12 19v3M2 12h3M19 12h3"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
							/>
							<circle
								cx="12"
								cy="12"
								r="8"
								fill="none"
								stroke="currentColor"
								stroke-width="1.6"
							/>
						</svg>
					</button>
					<button
						id="unit-toggle"
						class="pill-btn"
						title="Switch units (U)"
						aria-label="Switch temperature units"
					>
						°C
					</button>
					<button
						id="theme-toggle"
						class="icon-btn"
						title="Theme: auto (T)"
						aria-label="Toggle theme"
					>
						◐
					</button>
					<button
						id="share-btn"
						class="icon-btn"
						title="Copy share link"
						aria-label="Copy share link"
					>
						<svg
							viewBox="0 0 24 24"
							width="18"
							height="18"
							aria-hidden="true"
						>
							<path
								d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v12M8 7l4-4 4 4"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
					</button>
				</div>
			</header>

			<div
				id="favorites"
				class="fav-chips"
				aria-label="Saved locations"
			></div>

			<!-- ======= MAIN ======= -->
			<main id="main">
				<!-- Hero -->
				<section
					class="card hero reveal"
					id="hero"
					aria-live="polite"
				>
					<div
						class="skeleton sk-line"
						style="width: 38%"
					></div>
					<div
						class="skeleton sk-line"
						style="width: 24%; margin-top: 10px"
					></div>
					<div
						class="skeleton sk-hero"
						style="margin-top: 22px"
					></div>
					<div
						class="skeleton sk-line"
						style="width: 55%; margin-top: 22px"
					></div>
				</section>

				<!-- Stats grid -->
				<section
					class="stats-grid"
					id="stats"
					aria-label="Current weather details"
				>
					<div class="card stat-card skeleton-block">
						<div
							class="skeleton sk-line"
							style="width: 60%"
						></div>
						<div
							class="skeleton sk-num"
							style="margin-top: 12px"
						></div>
					</div>
					<div class="card stat-card skeleton-block">
						<div
							class="skeleton sk-line"
							style="width: 60%"
						></div>
						<div
							class="skeleton sk-num"
							style="margin-top: 12px"
						></div>
					</div>
					<div class="card stat-card skeleton-block">
						<div
							class="skeleton sk-line"
							style="width: 60%"
						></div>
						<div
							class="skeleton sk-num"
							style="margin-top: 12px"
						></div>
					</div>
					<div class="card stat-card skeleton-block">
						<div
							class="skeleton sk-line"
							style="width: 60%"
						></div>
						<div
							class="skeleton sk-num"
							style="margin-top: 12px"
						></div>
					</div>
					<div class="card stat-card skeleton-block">
						<div
							class="skeleton sk-line"
							style="width: 60%"
						></div>
						<div
							class="skeleton sk-num"
							style="margin-top: 12px"
						></div>
					</div>
					<div class="card stat-card skeleton-block">
						<div
							class="skeleton sk-line"
							style="width: 60%"
						></div>
						<div
							class="skeleton sk-num"
							style="margin-top: 12px"
						></div>
					</div>
					<div class="card stat-card skeleton-block">
						<div
							class="skeleton sk-line"
							style="width: 60%"
						></div>
						<div
							class="skeleton sk-num"
							style="margin-top: 12px"
						></div>
					</div>
					<div class="card stat-card skeleton-block">
						<div
							class="skeleton sk-line"
							style="width: 60%"
						></div>
						<div
							class="skeleton sk-num"
							style="margin-top: 12px"
						></div>
					</div>
				</section>

				<!-- Hourly chart + strip -->
				<section
					class="card reveal"
					id="hourly-card"
				>
					<h2 class="section-title">Next 48 hours</h2>
					<div
						class="chart-wrap"
						id="chart-wrap"
					>
						<canvas
							id="hourly-chart"
							height="260"
							aria-label="Hourly temperature and precipitation chart"
							role="img"
						></canvas>
						<div
							id="chart-tooltip"
							class="chart-tooltip"
							hidden
						></div>
					</div>
					<div
						class="hour-strip"
						id="hour-strip"
						role="list"
						aria-label="Next 24 hours"
					></div>
				</section>

				<!-- Daily + side panels -->
				<div class="row-2">
					<section
						class="card reveal"
						id="daily-card"
					>
						<h2 class="section-title">8-day forecast</h2>
						<div id="daily-list"></div>
					</section>

					<div class="side-stack">
						<section
							class="card reveal"
							id="sun-card"
						>
							<h2 class="section-title">Sun</h2>
							<div id="sun-widget"></div>
						</section>
						<section
							class="card reveal"
							id="wind-card"
						>
							<h2 class="section-title">Wind</h2>
							<div id="wind-widget"></div>
						</section>
					</div>
				</div>

				<!-- AQI + Outlook -->
				<div class="row-2">
					<section
						class="card reveal"
						id="aqi-card"
					>
						<h2 class="section-title">Air quality</h2>
						<div id="aqi-widget"></div>
					</section>
					<section
						class="card reveal"
						id="outlook-card"
					>
						<h2 class="section-title">Outlook</h2>
						<div id="outlook-widget"></div>
					</section>
				</div>

				<!-- Error panel -->
				<section
					class="card error-panel"
					id="error-panel"
					hidden
				>
					<h2>Couldn’t load weather data</h2>
					<p id="error-msg"></p>
					<button
						id="retry-btn"
						class="pill-btn primary"
					>
						Try again
					</button>
				</section>
			</main>

			<footer class="footer">
				<p>
					Weather data by
					<a
						href="https://open-meteo.com/"
						target="_blank"
						rel="noopener"
						>Open-Meteo</a
					>
					· Built with vanilla JS · No API keys, no tracking
				</p>
				<p class="shortcuts">
					Shortcuts: <kbd>/</kbd> search · <kbd>U</kbd> units ·
					<kbd>T</kbd> theme · <kbd>Esc</kbd> close search
				</p>
			</footer>
		</div>

		<div
			id="toast"
			class="toast"
			role="status"
			aria-live="polite"
			hidden
		></div>

		<noscript>
			<div
				style="
					position: fixed;
					inset: 0;
					display: grid;
					place-items: center;
					background: #0d1830;
					color: #eaf2ff;
					font-family: system-ui;
					z-index: 99;
				"
			>
				Nimbus needs JavaScript to fetch live weather data.
			</div>
		</noscript>

		<script
			type="module"
			src="./js/app.js"
		></script>
	</body>
</html>
